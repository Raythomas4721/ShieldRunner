<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="盾擊前線">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>盾擊前線 Shield Runner｜手機橫向射擊小遊戲</title>
  <meta name="description" content="舉盾擋子彈、開槍往前衝！閃過狙擊手的紅線、撐過直升機空襲，抵達撤離點完成任務。免下載，手機瀏覽器打開就能玩（請橫向遊玩）。">
  <!-- 分享到 LINE、Facebook 等時顯示的標題、說明與預覽圖 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="盾擊前線 Shield Runner">
  <meta property="og:title" content="盾擊前線 Shield Runner｜手機橫向射擊小遊戲">
  <meta property="og:description" content="舉盾擋子彈、開槍往前衝！閃過狙擊手的紅線、撐過直升機空襲，抵達撤離點完成任務。免下載，手機瀏覽器打開就能玩（請橫向遊玩）。">
  <meta property="og:url" content="https://raythomas4721.github.io/ShieldRunner/">
  <meta property="og:image" content="https://raythomas4721.github.io/ShieldRunner/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="zh_TW">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
      overscroll-behavior: none;   /* 不讓頁面被拖動或回彈 */
      touch-action: none;          /* 不讓瀏覽器處理縮放、捲動手勢 */
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #game { position: fixed; inset: 0; overflow: hidden; }
    /* 載入畫面：遊戲引擎下載完、主選單出現前顯示 */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: linear-gradient(#050816, #1b2a4a);
      font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif;
      transition: opacity 0.4s;
    }
    #loading .title { color: #ffd60a; font-size: 48px; font-weight: bold; letter-spacing: 4px; }
    #loading .sub { color: #a8dadc; font-size: 16px; letter-spacing: 6px; }
    #loading .bar { width: 180px; height: 6px; border-radius: 3px; background: #1c2541; overflow: hidden; margin-top: 10px; }
    #loading .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background: #4cc9f0;
      animation: slide 1s ease-in-out infinite;
    }
    #loading .hint { color: #8d99ae; font-size: 14px; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    #loading.done { opacity: 0; pointer-events: none; }
    /* 手機直拿時提示轉成橫向（iOS 無法鎖定方向） */
    #rotate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #000000;
      color: #f1faee;
      font: bold 22px "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    #rotate .phone {
      width: 40px;
      height: 70px;
      border: 4px solid #ffd60a;
      border-radius: 8px;
      animation: turn 1.6s ease-in-out infinite;
    }
    @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate { display: flex; }
    }
  </style>
  <!-- Phaser 3.80.1 放在專案裡，離線也能載入 -->
  <script src="lib/phaser.min.js"></script>
</head>
<body>
  <div id="game"></div>
  <div id="loading">
    <div class="title">盾擊前線</div>
    <div class="sub">SHIELD RUNNER</div>
    <div class="bar"></div>
    <div class="hint">載入中…</div>
  </div>
  <div id="rotate">
    <div class="phone"></div>
    <div>請將手機轉成橫向來遊玩</div>
  </div>
  <script type="module" src="src/main.js"></script>
  <script>
    // 註冊 Service Worker：第一次開啟後就能離線玩、也能加到主畫面
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
